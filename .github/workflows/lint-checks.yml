name: Lint Checks (Advisory)

# Advisory-only static analysis. These jobs never fail the PR: every lint
# step is marked continue-on-error so this workflow always reports success,
# while ruff/pyright findings still show up as inline warning annotations
# on the PR diff for reviewers to see.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        continue-on-error: true
        with:
          args: "check --output-format=github services"

  pyright:
    name: Pyright type check (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run pyright and annotate findings
        continue-on-error: true
        run: |
          set -o pipefail
          pyright --outputjson services/pipeline/src > pyright-output.json || true
          jq -r --arg root "$GITHUB_WORKSPACE/" '
            .generalDiagnostics[] |
            "::warning file=\(.file | sub("^" + $root; "")),line=\(.range.start.line + 1),col=\(.range.start.character + 1)::[pyright\(if .rule then " " + .rule else "" end)] \(.message)"
          ' pyright-output.json
          jq -r '.summary | "Pyright summary: \(.errorCount) errors, \(.warningCount) warnings, \(.informationCount) informations"' pyright-output.json
